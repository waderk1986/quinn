name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: Lint · Format · Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: JS lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

      - name: HTML validate
        run: npm run lint:html

      - name: Prettier check
        run: npm run format:check

      - name: Serve site
        run: npx serve . -p 8080 &
        # give the server a moment to start
        # before accessibility runner hits it

      - name: Wait for server
        run: sleep 3

      - name: Accessibility (pa11y)
        run: npm run a11y

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
